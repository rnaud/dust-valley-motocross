name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Install Pages artifact readiness client
        run: npm install --prefix "$RUNNER_TEMP/pages-artifact-client" --no-save --ignore-scripts @actions/artifact@2.1.3
      - name: Wait for Pages artifact metadata
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const {DefaultArtifactClient} = require(`${process.env.RUNNER_TEMP}/pages-artifact-client/node_modules/@actions/artifact`);
            const waitPagesArtifact = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/wait-pages-artifact.cjs`);
            await waitPagesArtifact({
              client: new DefaultArtifactClient(),
              name: process.env.PAGES_ARTIFACT,
              wait: ms => new Promise(resolve => setTimeout(resolve, ms)),
              log: message => core.info(message),
            });
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
